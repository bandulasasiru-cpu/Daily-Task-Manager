<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Daily To-Do List</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

</head>

<body>

    <div class="todo-container">

        <!-- Header -->

        <div class="header">
            <h1>My Daily To-Do List 📝</h1>
            <p>Organize your daily activities and stay productive!</p>

        </div>


        <!-- Add Task Section -->

        <div class="add-task">

            <input type="text" id="taskInput" placeholder="Enter a new task...">
            <button onclick="addTask()">+ Add Task </button>

        </div>

        <!-- Pending Tasks -->

        <div class="task-section">

            <h2>📌 My Tasks</h2>

            <div id="taskList" class="task-list">

            </div>

        </div>


        <!-- Completed Tasks -->

        <div class="completed-section">

            <h2>✅ Completed Tasks</h2>

            <div id="completedTasks" class="task-list">

            </div>

        </div>

        <!-- Footer -->

        <div class="footer">

            <p>Stay focused. Keep growing. 🌱</p>

        </div>

    </div>

    <!-- Custom Popup -->

    <div id="popupOverlay" class="popup-overlay">

        <div class="popup-box">

            <div id="popupIcon" class="popup-icon">✏️</div>

            <h2 id="popupTitle">Edit Task</h2>

            <p id="popupMessage">Enter your new task name.</p>

            <input type="text" id="popupInput" placeholder="Enter task name...">

            <div class="popup-buttons">

                <button id="cancelBtn" class="cancel-btn">Cancel</button>

                <button id="confirmBtn" class="confirm-btn">Confirm</button>

            </div>

        </div>

    </div>


    <script src="app.js"></script>

</body>

</html>
